<!DOCTYPE html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" sizes="192x192" href="/icon-192.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <meta name="theme-color" content="#0A0A0A" />
    <title>MyKaado</title>
    <meta name="description" content="Learn Japanese with Spaced Repetition" />
    
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <!-- Outfit Font -->
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700;800;900&display=swap" rel="stylesheet" />
    
    <style>
      @font-face {
        font-family: 'UD Digi Kyokasho N-R';
        src: url('/fonts/UDDigiKyokashoN-R-01.ttf') format('truetype');
        font-weight: normal;
        font-style: normal;
        font-display: swap;
      }
      :root {
        --font-outfit: 'Outfit', sans-serif;
        --font-jp-custom: 'UD Digi Kyokasho N-R', sans-serif;
      }
    </style>

    <script>
      try {
        let theme = localStorage.getItem('theme') || 'light';
        let style = localStorage.getItem('style') || 'neobrutalism';
        let color = localStorage.getItem('color') || (theme === 'dark' ? 'crimson' : 'matcha');
        
        document.documentElement.setAttribute('data-theme', theme);
        document.documentElement.setAttribute('data-style', style);
        document.documentElement.setAttribute('data-color', color);
        
        if (theme === 'dark') {
          document.documentElement.classList.add('dark');
        } else {
          document.documentElement.classList.remove('dark');
        }
      } catch (e) {}
    </script>
  </head>
  <body class="antialiased">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
